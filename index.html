<style>
  :root{
    --bg:#05060a; --panel:#0a0d14; --cyan:#00f0ff; --mag:#ff2bd6;
    --dim:#7a8494; --ok:#39ff88; --warn:#ffb020; --border:#1b2233;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:#dfe6f0;
    font-family:"JetBrains Mono","Fira Code","Cascadia Code",Consolas,Menlo,monospace;
    display:flex;flex-direction:column;align-items:center;
    min-height:100vh;overflow-x:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* شبكة + نيون خلفية */
  body::before{
    content:"";position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(ellipse 80% 50% at 20% 0%, rgba(0,240,255,.07), transparent),
      radial-gradient(ellipse 60% 40% at 85% 100%, rgba(255,43,214,.06), transparent),
      linear-gradient(rgba(0,240,255,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,240,255,.028) 1px, transparent 1px);
    background-size:auto,auto,42px 42px,42px 42px;
  }
  /* سكان لاين */
  body::after{
    content:"";position:fixed;inset:0;z-index:50;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply;
  }

  .wrap{width:min(720px,92vw);padding:56px 0 40px}

  /* شريط اللغة */
  .topbar{display:flex;justify-content:flex-end;margin-bottom:38px}
  select{
    background:var(--panel);color:var(--cyan);border:1px solid var(--border);
    font:inherit;font-size:.82rem;padding:8px 12px;cursor:pointer;
    appearance:none;-webkit-appearance:none;border-radius:2px;
    box-shadow:0 0 12px rgba(0,240,255,.12), inset 0 0 8px rgba(0,240,255,.05);
  }
  select:hover{border-color:var(--cyan)}
  select:focus{outline:1px solid var(--cyan)}

  /* العنوان glitch */
  .logo{
    text-align:center;font-weight:800;letter-spacing:.35em;
    font-size:clamp(1.9rem,6vw,3.2rem);color:#fff;position:relative;
    text-transform:uppercase;margin-bottom:10px;user-select:none;
  }
  .logo::before,.logo::after{
    content:attr(data-t);position:absolute;inset:0;overflow:hidden;
  }
  .logo::before{color:var(--cyan);animation:gl1 3.2s infinite steps(1)}
  .logo::after{color:var(--mag);animation:gl2 3.2s infinite steps(1)}
  @keyframes gl1{0%,89%{clip-path:inset(100% 0 0 0)}90%{clip-path:inset(10% 0 78% 0);transform:translateX(-3px)}93%{clip-path:inset(62% 0 18% 0);transform:translateX(2px)}96%{clip-path:inset(30% 0 55% 0)}100%{clip-path:inset(100% 0 0 0)}}
  @keyframes gl2{0%,91%{clip-path:inset(100% 0 0 0)}92%{clip-path:inset(75% 0 8% 0);transform:translateX(3px)}95%{clip-path:inset(18% 0 70% 0);transform:translateX(-2px)}98%{clip-path:inset(48% 0 40% 0)}100%{clip-path:inset(100% 0 0 0)}}

  .tagline{text-align:center;color:var(--dim);font-size:.9rem;margin-bottom:46px}
  .tagline b{color:var(--cyan);font-weight:400}

  /* عنوان القسم */
  .sec-h{
    display:flex;align-items:center;gap:12px;color:var(--cyan);
    font-size:.78rem;letter-spacing:.25em;text-transform:uppercase;margin:42px 0 16px;
  }
  .sec-h::before{content:">>";color:var(--mag)}
  .sec-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

  /* صناديق */
  .panel{
    background:var(--panel);border:1px solid var(--border);border-radius:3px;
    padding:22px;position:relative;
    box-shadow:0 0 24px rgba(0,0,0,.5);
  }
  .panel::before,.panel::after{
    content:"";position:absolute;width:14px;height:14px;border-color:var(--cyan);
    border-style:solid;opacity:.85;
  }
  .panel::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
  .panel::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}

  /* صندوق الأونيون */
  .onion{
    display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;
  }
  .addr{
    flex:1;min-width:230px;background:#000;color:var(--ok);
    padding:14px;font-size:.85rem;word-break:break-all;line-height:1.7;
    border:1px solid #123;box-shadow:inset 0 0 14px rgba(57,255,136,.08);
  }
  .addr::before{content:"▸ ";color:var(--dim)}
  .btn{
    font:inherit;font-size:.85rem;padding:14px 22px;cursor:pointer;
    background:transparent;border:1px solid;border-radius:2px;
    transition:all .15s;white-space:nowrap;
  }
  .btn-copy{color:var(--cyan);border-color:var(--cyan)}
  .btn-copy:hover{background:var(--cyan);color:#000;box-shadow:0 0 18px rgba(0,240,255,.6)}
  .btn-open{color:var(--mag);border-color:var(--mag)}
  .btn-open:hover{background:var(--mag);color:#000;box-shadow:0 0 18px rgba(255,43,214,.6)}
  .btn:active{transform:translateY(1px)}

  /* الخطوات */
  .steps{counter-reset:s}
  .step{
    display:flex;gap:14px;align-items:flex-start;padding:12px 4px;
    border-bottom:1px dashed var(--border);font-size:.88rem;color:#b8c2d0;
  }
  .step:last-child{border-bottom:none}
  .step::before{
    counter-increment:s;content:"0" counter(s);color:var(--mag);font-weight:700;
    font-size:.95rem;min-width:2em;
  }

  /* تحذير التصيد */
  .warn{border-color:#4a3000}
  .warn::before,.warn::after{border-color:var(--warn)}
  .warn h3{color:var(--warn);font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px}
  .warn p{font-size:.85rem;color:#d0c090;line-height:1.7}

  .badge{
    display:inline-flex;align-items:center;gap:8px;margin-top:6px;
    font-size:.72rem;color:var(--cyan);border:1px solid var(--cyan);
    padding:4px 10px;border-radius:999px;letter-spacing:.15em;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);
    box-shadow:0 0 8px var(--ok);animation:pulse 1.8s infinite}
  @keyframes pulse{50%{opacity:.35}}

  footer{
    margin-top:52px;text-align:center;color:var(--dim);
    font-size:.72rem;letter-spacing:.12em;
  }
  footer span{color:var(--border)}

  [dir="rtl"] .sec-h::before{content:"<<"}
  [dir="rtl"] .addr{direction:ltr;text-align:left}

  /* بدون JS */
  .nojs{
    text-align:center;color:var(--warn);font-size:.8rem;padding:14px;
    border:1px dashed var(--warn);border-radius:2px;margin-bottom:24px;
  }
  html:not([data-js]) .nojs{display:block}
  [data-js] .nojs{display:none}
</style>
</head>

const select = document.getElementById("lang");

function apply(lang){
  const t = I18N[lang] || I18N.en;
  document.documentElement.lang = lang;
  document.documentElement.dir = t.dir || "ltr";
  document.querySelectorAll("[data-i]").forEach(el => {
    const v = t[el.dataset.i];
    if (typeof v === "string") el.textContent = v;
  });
  try { localStorage.setItem("bc-lang", lang); } catch(e){}
}

select.addEventListener("change", () => apply(select.value));

let saved = null;
try { saved = localStorage.getItem("bc-lang"); } catch(e){}
const nav = (navigator.language || "en").slice(0,2).toLowerCase();
const initial = saved && I18N[saved] ? saved : (I18N[nav] ? nav : "ar");
select.value = initial;
apply(initial);

// زر النسخ
document.getElementById("copyBtn").addEventListener("click", async function(){
  const t = I18N[select.value] || I18N.ar;
  let ok = false;
  try { await navigator.clipboard.writeText(ONION); ok = true; } catch(e){}
  if (!ok) {
    const ta = document.createElement("textarea");
    ta.value = ONION; document.body.appendChild(ta);
    ta.select(); try { document.execCommand("copy"); ok = true; } catch(e){}
    ta.remove();
  }
  this.textContent = ok ? t.copied : ONION;
  setTimeout(() => { this.textContent = t.copy; }, 2200);
});
